org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 注意：本机 JDK 由 build.cmd（JAVA_HOME）或 CI（actions/setup-java）提供，
# 不要把机器相关的 org.gradle.java.home 写在这里，否则仓库无法在别的环境构建。
# 本地直接运行 gradlew 前请先执行 build.cmd 或在环境里设置 JAVA_HOME（JDK 17）。
