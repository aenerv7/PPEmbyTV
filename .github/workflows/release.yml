name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.0.1). Leave empty to keep build.gradle.kts versionName."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 从 GitHub Secrets 恢复签名密钥（未配置时回退 debug 签名）
      # secrets 通过 env 传入，避免直接内联进脚本（GitHub 官方推荐写法）
      - name: Restore signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > MAGI-OpenSource.jks
            echo "storeFile=MAGI-OpenSource.jks" > keystore.properties
            echo "storePassword=$SIGNING_STORE_PASSWORD" >> keystore.properties
            echo "keyAlias=$SIGNING_KEY_ALIAS" >> keystore.properties
            echo "keyPassword=$SIGNING_KEY_PASSWORD" >> keystore.properties
            echo "::notice::Release signing key restored from secrets"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 not set - release will use the fallback debug signature"
            # 生成一次性 debug keystore，保证 validateSigningRelease 通过
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" -storetype PKCS12 2>/dev/null
          fi

      # 版本号：tag 优先（v0.0.1 -> 0.0.1），否则用手动输入或 build.gradle.kts 默认值
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION_NAME"

      - name: Verify APK signature
        shell: bash
        run: |
          set +e
          SIGNER=""
          for d in "$ANDROID_HOME"/build-tools/*/apksigner; do
            [ -x "$d" ] && SIGNER="$d" && break
          done
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "artifact: $(basename "$apk") ($(du -h "$apk" | cut -f1))"
            if [ -n "$SIGNER" ] && [ -f MAGI-OpenSource.jks ]; then
              "$SIGNER" verify --print-certs "$apk" 2>&1 | head -3
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PP TV v${{ steps.version.outputs.version }}
          body: |
            ## PP TV（皮皮 TV）v${{ steps.version.outputs.version }}

            Android TV Emby 客户端。功能参考 ChaiChaiEmbyTV（不含弹幕）。

            ### 功能
            - 🎬 原生 TV 体验（Compose TV 焦点导航）
            - 🎮 播放器：倍速、多音轨/字幕切换、字幕延迟调整
            - 📱 扫码配置服务器
            - 🔄 播放进度自动同步 Emby
            - 📺 多服务器管理
            - 🌐 http/socks5 代理

            ### APK
            - `app-arm64-v8a-release.apk` — 64 位 ARM 设备
            - `app-armeabi-v7a-release.apk` — 32 位 ARM 设备
            - `app-universal-release.apk` — 全架构通用包

            仅供学习交流使用。
          files: |
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
